maturity_note: "This list is an OWASP Incubator project and has not reached v1.0. Identifiers are provisional."
risks:
  - code: "AST01"
    title: "Malicious Skills"
    summary: "A skill pack whose SKILL.md or bundled files are written to harm the host or the user, not to help with the stated task."
    description: "AIGoat loads SKILL.md and shows a fake home directory with decoy keys. Bundled scripts are inspected, never executed. The lesson is that a model matching a friendly description cannot see the payload it will later run."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
      - "owasp-llm-2026:LLM04"
  - code: "AST02"
    title: "Supply Chain Compromise"
    summary: "A typosquatted or substituted skill name can be loaded in place of the pack the user thought they installed."
    description: "A local registry with lookalike names makes the swap visible. Learners compare a pinned hash loader against a name-only install. Real third-party registries are not contacted."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
      - "owasp-llm-2026:LLM04"
  - code: "AST03"
    title: "Over-Privileged Skills"
    summary: "A skill can declare a tight allowed-tools list and still be invoked with broader host capabilities."
    description: "The Agent Skills allowed-tools field is experimental and easy to ignore. Level 0 parses it and does not enforce it, so the declared-versus-actual gap is the whole lab."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI02"
      - "owasp-llm-2026:LLM03"
  - code: "AST04"
    title: "Insecure Metadata"
    summary: "Frontmatter can impersonate a trusted author or understate what the skill is allowed to do."
    description: "Impersonation and understated permissions are hands-on. Unsafe YAML gadgets are simulated only: deserializing attacker YAML into Python objects would be platform RCE, which this project will not ship."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
  - code: "AST05"
    title: "Untrusted External Instructions"
    summary: "A skill that fetches 'the docs' from another URL can have those docs swapped after the user approved the pack."
    description: "This is the best local fit on the list. A second local endpoint serves the external document and mutates it mid-lab, so learners watch a live rug-pull without leaving the machine."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI01"
      - "owasp-llm-2026:LLM01"
  - code: "AST06"
    title: "Weak Isolation"
    summary: "A skill that shares the host filesystem and network has no real sandbox even if the UI calls the mode 'restricted'."
    description: "AIGoat toggles a simulated host-mode versus restricted-mode view. Real container escape is out of budget and out of bounds. The score is on which paths the loader would have opened."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI02"
  - code: "AST07"
    title: "Update Drift"
    summary: "A skill that changes on disk between loads can grow new instructions the user never re-approved."
    description: "Deterministic and model-free: mutate a file between two loads, then show a pinned loader rejecting the new hash. Learners do not need the LLM to succeed."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
  - code: "AST08"
    title: "Poor Scanning"
    summary: "A regex scanner that looks for obvious sink words will miss instructions written as ordinary prose."
    description: "AIGoat ships a naive scanner and asks learners to bypass it with wording that never matches the pattern. The point is that skill bodies have no format restrictions, so pattern lists are not a control."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
  - code: "AST09"
    title: "No Governance"
    summary: "There is no attacker action to perform when the failure is 'nobody owned the catalogue'."
    description: "This entry is documentation and a blue-team exercise: build the audit trail of which skill was loaded, when, and by whom. It is not a hands-on exploit lab."
    attack_surfaces: ["skill.runtime"]
    related: []
  - code: "AST10"
    title: "Cross-Platform Reuse"
    summary: "Converting a skill between runtimes can drop security fields that only one vendor honoured."
    description: "A simulated converter diffs what was stripped. Learners see allowed-tools or compatibility notes disappear, which is why qualified ids such as owasp-skills-2026:AST10 are mandatory in this repo."
    attack_surfaces: ["skill.runtime"]
    related:
      - "owasp-agentic-2026:ASI04"
