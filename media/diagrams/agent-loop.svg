<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Shop agent loop</title>
  <desc id="d">Goal to planner to Intent Gate to tool to observation. L1 tool.allowlist sits on the gate. L2 tool.approval and memory.scan sit on refund and memory paths.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #475569; }
    .box { fill: none; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .accent { stroke: #6366f1; }
    .danger { stroke: #ef4444; }
    .lbl { font-size: 13px; font-weight: 700; }
    .sub { font-size: 12px; }
    .cap { font-size: 12px; }
  </style>
  <rect class="box" x="16" y="88" width="112" height="56"/>
  <text class="lbl" x="72" y="114" text-anchor="middle">Goal</text>
  <text class="sub" x="72" y="132" text-anchor="middle">learner text</text>

  <path d="M128 116 H168" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="168" y="88" width="112" height="56"/>
  <text class="lbl" x="224" y="114" text-anchor="middle">Planner</text>
  <text class="sub" x="224" y="132" text-anchor="middle">untrusted</text>

  <path d="M280 116 H320" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box accent" x="320" y="80" width="140" height="72"/>
  <text class="lbl" x="390" y="108" text-anchor="middle" fill="#6366f1">Intent Gate</text>
  <text class="sub" x="390" y="128" text-anchor="middle">decides the call</text>

  <path d="M460 116 H500" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box danger" x="500" y="88" width="112" height="56"/>
  <text class="lbl" x="556" y="114" text-anchor="middle">Tool</text>
  <text class="sub" x="556" y="132" text-anchor="middle">refund / export</text>

  <path d="M556 144 V188 H72 V144" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="16" y="196" width="112" height="48"/>
  <text class="lbl" x="72" y="218" text-anchor="middle">Observation</text>
  <text class="sub" x="72" y="234" text-anchor="middle">back to planner</text>

  <rect class="box accent" x="320" y="16" width="140" height="44"/>
  <text class="cap" x="390" y="34" text-anchor="middle" fill="#6366f1">L1 tool.allowlist</text>
  <text class="sub" x="390" y="50" text-anchor="middle">unknown tools denied</text>
  <path d="M390 60 V80" stroke="#6366f1" stroke-width="1.2"/>

  <rect class="box danger" x="500" y="16" width="200" height="44"/>
  <text class="cap" x="600" y="34" text-anchor="middle" fill="#ef4444">L2 tool.approval</text>
  <text class="sub" x="600" y="50" text-anchor="middle">refund / export pause</text>
  <path d="M556 60 V88" stroke="#ef4444" stroke-width="1.2"/>

  <rect class="box accent" x="168" y="196" width="160" height="48"/>
  <text class="cap" x="248" y="216" text-anchor="middle" fill="#6366f1">L2 memory.scan</text>
  <text class="sub" x="248" y="232" text-anchor="middle">drops planted notes</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
