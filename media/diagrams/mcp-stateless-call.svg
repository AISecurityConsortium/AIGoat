<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="t d">
  <title id="t">Stateless MCP call</title>
  <desc id="d">One learner action spawns a stdio MCP server, runs a single JSON-RPC, then reaps the process. There is no connect handshake.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #475569; }
    .box { fill: none; stroke: #64748b; stroke-width: 1.5; rx: 8; }
    .accent { stroke: #6366f1; }
    .lbl { font-size: 13px; font-weight: 700; }
    .sub { font-size: 12px; }
  </style>
  <rect class="box" x="20" y="72" width="130" height="64"/>
  <text class="lbl" x="85" y="98" text-anchor="middle">Action</text>
  <text class="sub" x="85" y="116" text-anchor="middle">discover / list / call</text>

  <path d="M150 104 H196" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box accent" x="196" y="72" width="140" height="64"/>
  <text class="lbl" x="266" y="98" text-anchor="middle" fill="#6366f1">Spawn stdio</text>
  <text class="sub" x="266" y="116" text-anchor="middle">allowlisted argv</text>

  <path d="M336 104 H382" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="382" y="72" width="140" height="64"/>
  <text class="lbl" x="452" y="98" text-anchor="middle">One RPC</text>
  <text class="sub" x="452" y="116" text-anchor="middle">JSON-RPC 2026-07-28</text>

  <path d="M522 104 H568" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="box" x="568" y="72" width="132" height="64"/>
  <text class="lbl" x="634" y="98" text-anchor="middle">Reap</text>
  <text class="sub" x="634" y="116" text-anchor="middle">process gone</text>

  <text class="sub" x="360" y="28" text-anchor="middle">No connect handshake. Each click is a new child.</text>
  <text class="sub" x="360" y="188" text-anchor="middle">Read the tool description as attacker-controlled text. It can change between two list calls.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
